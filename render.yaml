# Render Blueprint — New + > Blueprint > connect this repo.
# Written for a Render **Pro workspace** (autoscaling, Postgres high availability) using the current
# compute plan names (https://render.com/docs/blueprint-spec). The Postgres schema is managed by Prisma
# (prisma/schema.prisma + prisma/migrations), applied by the preDeployCommand. The Render web app never receives patient
# data: it only serves trained model bundles exported from the Mayo Clinic Platform workspace.
#
# HIPAA: Render signs a Business Associate Agreement only for HIPAA-enabled workspaces, which need a Scale or
# Enterprise plan (Pro is not enough; https://render.com/docs/hipaa-compliance). Until that is in place, do not
# enter real patient information. See docs/SECURITY_COMPLIANCE.md.
services:
  - type: web
    name: cardioai-cvd-risk
    runtime: python
    region: ohio
    plan: 1c-2g                      # 1 CPU / 2 GB per instance; models are small gradient-boosted trees
    scaling:                         # autoscaling needs a Pro workspace or higher
      minInstances: 1
      maxInstances: 3
      targetCPUPercent: 70
      targetMemoryPercent: 80
    autoDeployTrigger: checksPass    # deploy only after the GitHub Actions "tests" workflow (pytest + prisma) passes
    buildCommand: pip install -r requirements.txt && npm ci
    preDeployCommand: python scripts/db_migrate.py   # Prisma migrations (prisma migrate deploy) before each deploy
    startCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
      --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION            # Prisma 7 needs Node >= 22.12 (also pinned in .node-version)
        value: 22.18.0
      - key: DB_SCHEMA_MANAGER       # Prisma owns the Postgres schema; the app never creates tables itself
        value: prisma
      - key: APP_ENV
        value: production
      - key: SECRET_KEY              # shared by all instances: signs MFA challenges, derives CSRF tokens
        generateValue: true
      - key: MFA_ENCRYPTION_KEY      # encrypts TOTP secrets at rest; keep it when rotating SECRET_KEY
        generateValue: true
      - key: DATABASE_URL            # private-network URL (the database accepts no public connections)
        fromDatabase:
          name: cardioai-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false                  # first administrator's email; created once at startup if it does not exist
      - key: ADMIN_PASSWORD
        sync: false                  # 12+ chars; MFA enrolment is forced at first sign-in. Change it in the app afterwards
      # --- accounts, sessions and sign-in protection (app/config.py has the defaults)
      - key: SIGNUP_MODE
        value: approval              # approval: anyone may request an account, an admin approves it | closed: admins only
      - key: SIGNUP_ALLOWED_DOMAINS
        value: ""                    # e.g. "cardioailive.com,mayo.edu" to restrict who may request an account
      - key: REQUIRE_MFA
        value: "true"
      - key: SESSION_IDLE_MINUTES
        value: "15"                  # automatic logoff
      - key: SESSION_MAX_HOURS
        value: "12"
      - key: LOCKOUT_THRESHOLD
        value: "5"
      - key: LOCKOUT_MINUTES
        value: "15"
      - key: ASSESSMENT_RETENTION_DAYS
        value: "365"
      # Model bundle: either commit it under models/ and point MODEL_DIR there,
      # or host the .tar.gz privately and set MODEL_BUNDLE_URL (+ token).
      - key: MODEL_DIR
        value: models/synthetic-demo
      - key: MODEL_BUNDLE_URL
        sync: false
      - key: MODEL_BUNDLE_TOKEN
        sync: false
      - key: ALLOW_DEMO_MODELS
        value: "true"                # set to "false" once the Mayo-trained bundle is live
      - key: STORE_ASSESSMENTS
        value: "true"

databases:
  - name: cardioai-db
    region: ohio                     # must match the web service for private networking; fixed after creation
    plan: 1c-4g                      # >= 1 CPU so high availability can be switched on
    diskSizeGB: 15
    postgresMajorVersion: "17"       # fixed after creation
    databaseName: cardioai
    user: cardioai
    ipAllowList: []                  # private network only: no connections from the public internet
    highAvailability:
      enabled: false                 # Pro workspace: set true for a hot standby (roughly doubles database cost)
